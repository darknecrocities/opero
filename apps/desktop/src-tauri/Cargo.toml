[package]
name = "opero-desktop"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "OPERO — MMI Local-First AI Workflow Documentation Desktop Application"

[lib]
name = "opero_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["rt-multi-thread"] }
opero-core = { path = "../../../crates/opero-core" }
opero-daemon = { path = "../../../crates/opero-daemon" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
