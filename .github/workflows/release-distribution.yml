name: Release Distribution (.dmg & .exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pre-release-gate:
    name: Pre-Release Verification & Maintainability Gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/check_maintainability.py --strict
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace
      - run: pnpm typecheck && pnpm test:vitest

  build-distribution-bundles:
    name: Build ${{ matrix.label }}
    needs: pre-release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (.dmg)
            platform: macos-latest
            bundles: app,dmg
            artifact: opero-macos-dmg
          - label: Windows (.exe NSIS)
            platform: windows-latest
            bundles: nsis
            artifact: opero-windows-exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/generate_desktop_icons.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opero/desktop tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe

  publish-github-release:
    name: Publish Official main Release (SHA256SUMS + latest.json)
    needs: build-distribution-bundles
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt & latest.json
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd release-assets
          find . -mindepth 2 -type f \( -name '*.dmg' -o -name '*.exe' \) -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          sha256sum *.dmg *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          VERSION="${TAG_NAME#v}"
          DMG_FILE="$(ls *.dmg 2>/dev/null | head -n 1 || true)"
          EXE_FILE="$(ls *.exe 2>/dev/null | head -n 1 || true)"
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "channel": "main",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "notes": "Official OPERO ${TAG_NAME} release from main branch.",
            "platforms": {
              "darwin-aarch64": {
                "url": "https://github.com/darknecrocities/opero/releases/download/${TAG_NAME}/${DMG_FILE}"
              },
              "windows-x86_64": {
                "url": "https://github.com/darknecrocities/opero/releases/download/${TAG_NAME}/${EXE_FILE}"
              }
            }
          }
          EOF
          cat latest.json
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: release-assets/*
