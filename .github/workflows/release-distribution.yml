name: Release Distribution (.dmg & .exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pre-release-gate:
    name: Pre-Release Verification & Maintainability Gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/check_maintainability.py --strict
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace
      - run: pnpm typecheck && pnpm test:vitest

  build-distribution-bundles:
    name: Build ${{ matrix.label }}
    needs: pre-release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (.dmg)
            platform: macos-latest
            bundles: app,dmg
            artifact: opero-macos-dmg
          - label: Windows (.exe NSIS)
            platform: windows-latest
            bundles: nsis
            artifact: opero-windows-exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/generate_desktop_icons.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opero/desktop tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe

  publish-github-release:
    name: Publish GitHub Release with SHA256SUMS
    needs: build-distribution-bundles
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
