name: Bug Report
description: Report a reproducible defect in OPERO Desktop, Rust Core, or Installers
title: "fix(scope): <concise bug summary>"
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 10 / 11 (x64)
        - Linux (Wayland / X11)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      placeholder: "1. Launch OPERO...\n2. Click Start Capture...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
    validations:
      required: true
